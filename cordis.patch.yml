# dsh-session-canvas bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the dsh.bundle.patch
# manifest field) over dsh-base; the node half (exports ".") runs in the host
# process (session reading + creation HTTP API), and the dsh.client
# declaration in package.json makes the browser half (exports "./client",
# served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: session-canvas
      name: '@jackyoung022/dsh-session-canvas'
